name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest

      - name: Build exact deployment image
        run: docker build -t labelcheck-ai:test .

      - name: Start deployment image
        run: |
          docker run -d --name labelcheck-test -p 10000:10000 labelcheck-ai:test
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:10000/health >/tmp/health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/health.json

      - name: Verify locally bundled OCR assets
        run: |
          curl -fsS http://127.0.0.1:10000/static/ocr/tesseract.min.js >/dev/null
          curl -fsS http://127.0.0.1:10000/static/ocr/worker.min.js >/dev/null
          curl -fsS http://127.0.0.1:10000/static/ocr/lang/eng.traineddata.gz >/dev/null
          curl -fsS http://127.0.0.1:10000/static/ocr/core/tesseract-core.wasm.js >/dev/null
          curl -fsS http://127.0.0.1:10000/static/ocr/core/tesseract-core-simd.wasm.js >/dev/null
          curl -fsS http://127.0.0.1:10000/static/ocr/core/tesseract-core-lstm.wasm.js >/dev/null
          curl -fsS http://127.0.0.1:10000/static/ocr/core/tesseract-core-simd-lstm.wasm.js >/dev/null
          curl -fsS http://127.0.0.1:10000/api/demo-image >/dev/null

      - name: Install browser smoke-test dependency
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Run built-in demo in a real browser
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          dialogs = []
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.on("dialog", lambda dialog: (dialogs.append(dialog.message), dialog.dismiss()))
              page.goto("http://127.0.0.1:10000", wait_until="networkidle")
              page.click("#demo-button")
              page.wait_for_function(
                  "() => document.querySelector('#client-status').textContent.includes('Demo complete')",
                  timeout=90000,
              )
              page.wait_for_selector("#result-section:not(.hidden)", timeout=5000)
              overall = page.locator("#overall").inner_text().strip()
              print("Demo result:", overall)
              if dialogs:
                  raise AssertionError(f"Browser dialog errors: {dialogs}")
              if overall not in {"PASS", "REVIEW NEEDED"}:
                  raise AssertionError(f"Unexpected demo result: {overall}")

              # Verify unreadable-image UX in the same real browser.
              from PIL import Image
              Image.new("RGB", (600, 400), "white").save("/tmp/blank.png")
              dialogs.clear()
              page.locator("#label-image").set_input_files("/tmp/blank.png")
              page.click("#verify-button")
              page.wait_for_function(
                  "() => document.querySelector('#client-status').textContent.includes('No readable text was detected')",
                  timeout=30000,
              )
              if not dialogs:
                  raise AssertionError("Unreadable image did not surface a clear user-facing message.")
              if "No readable text was detected" not in dialogs[-1]:
                  raise AssertionError(f"Unexpected unreadable-image message: {dialogs[-1]}")
              if "[object Object]" in dialogs[-1]:
                  raise AssertionError("Unreadable-image error regressed to [object Object].")
              if not page.locator("#result-section").evaluate("(el) => el.classList.contains('hidden')"):
                  raise AssertionError("Failed verification left a stale prior result visible.")
              print("Unreadable-image UX:", dialogs[-1])

              # Verify batch manifests cannot silently skip missing files.
              page.locator("section.card details summary").last.click()
              with open("/tmp/missing.csv", "w", encoding="utf-8") as handle:
                  handle.write(
                      "filename,brand_name,class_type,alcohol_content,net_contents,"
                      "producer_name_address,country_of_origin\n"
                      "missing.png,OLD TOM DISTILLERY,Kentucky Straight Bourbon Whiskey,"
                      "45% Alc./Vol. (90 Proof),750 mL,"
                      "\"Bottled by Old Tom Distillery, Frankfort, KY\",\n"
                  )
              dialogs.clear()
              page.locator("#batch-manifest").set_input_files("/tmp/missing.csv")
              page.locator("#batch-images").set_input_files("/tmp/blank.png")
              page.click("#batch-button")
              page.wait_for_function(
                  "() => document.querySelector('#batch-status').textContent.includes('Missing image files')",
                  timeout=10000,
              )
              if not dialogs or "Missing image files referenced by the manifest" not in dialogs[-1]:
                  raise AssertionError(f"Missing batch images were not reported clearly: {dialogs}")
              print("Missing-image batch UX:", dialogs[-1])
              browser.close()
          PY

      - name: Show container logs
        if: always()
        run: docker logs labelcheck-test || true

      - name: Clean up
        if: always()
        run: docker rm -f labelcheck-test || true
